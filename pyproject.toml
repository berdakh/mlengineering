[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcourse"
version = "1.0.0"
description = "Helpers for the Applied ML Engineering course notebooks: checks, progress, data."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []   # the helpers use the standard library only; course requirements are in requirements*.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
