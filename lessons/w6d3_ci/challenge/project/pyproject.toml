[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.6.0"
description = "Fault detection on the SKAB water-circulation testbed (educational prototype)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.1",
    "fastapi>=0.115", "pydantic>=2.6", "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
