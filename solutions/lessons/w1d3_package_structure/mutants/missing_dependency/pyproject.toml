[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpwatch"
version = "0.1.0"
description = "Window-level fault detection for (synthetic) pump vibration data."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pumpwatch = "pumpwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
