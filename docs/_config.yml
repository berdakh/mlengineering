# GitHub Pages configuration for the Applied ML Engineering course site.
#
# Published from the /docs folder by .github/workflows/pages.yml.
# One-time setup by a repository admin: Settings -> Pages -> Source: "GitHub Actions".

title: Applied ML Engineering
description: >-
  A 12-week, self-paced course in applied ML engineering: SQL, pandas, feature pipelines, honest validation,
  testing, packaging, APIs, Docker, CI, cloud basics and monitoring, in notebooks that run in Google Colab.
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true


aux_links:
  "Start in Colab":
    - "https://colab.research.google.com/github/berdakh/mlengineering/blob/main/notebooks/01_welcome_and_colab.ipynb"
  "Repository":
    - "https://github.com/berdakh/mlengineering"
aux_links_new_tab: true

nav_external_links:
  - title: Open in Colab
    url: https://colab.research.google.com/github/berdakh/mlengineering

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Applied ML Engineering course materials. Code is MIT licensed; prose is CC BY 4.0.
  The SKAB dataset is GPL-3.0 and is downloaded from its source, not redistributed here.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/diagrams/src
  - handbook/figures/*/make_figures.py
  - handbook/figures/*/*.csv
