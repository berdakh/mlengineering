# GitHub Pages configuration for the Applied ML Engineering course site.
#
# Published from the /docs folder by .github/workflows/pages.yml.
# One-time setup by a repository admin: Settings -> Pages -> Source: "GitHub Actions".

title: Applied ML Engineering
description: >-
  An eight-week, hands-on program: develop, evaluate and deliver machine-learning models as
  reliable software - from a research script to a monitored prediction service.
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true


aux_links:
  "Notebooks on GitHub":
    - "https://github.com/berdakh/mlengineering-/tree/main/notebooks"
  "Repository":
    - "https://github.com/berdakh/mlengineering-"
aux_links_new_tab: true

nav_external_links:
  - title: Open in Colab
    url: https://colab.research.google.com/github/berdakh/mlengineering-

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Applied ML Engineering course materials. Code is MIT licensed; prose is CC BY 4.0.
  The SKAB dataset is GPL-3.0 and is downloaded from its source, not redistributed here.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/diagrams/src
  - handbook/figures/*/make_figures.py
  - handbook/figures/*/*.csv
