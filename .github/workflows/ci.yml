# Course self-check: the checks must accept every reference solution and reject every mutant,
# on each supported Python version. This verifies the course material, not the learner.
name: course-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Schedule files are in sync with tools/build_course.py
        run: |
          python tools/build_course.py
          git diff --exit-code course.json roadmap/SCHEDULE.md
      - name: Checks accept reference solutions and reject mutants
        run: python tools/verify_checks.py --all
