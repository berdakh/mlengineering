# Course self-check: the checks must accept every reference solution and reject every mutant.
# This verifies the course material, not the learner.
#
# A full run takes about 30 minutes per Python version, so pushes run one version and the
# three-version matrix runs weekly and on demand (Actions tab -> course-checks -> Run workflow).
name: course-checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: course-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: CPU-only PyTorch for lesson w4d3
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Schedule files are in sync with tools/build_course.py
        run: |
          python tools/build_course.py
          git diff --exit-code course.json roadmap/SCHEDULE.md
      - name: Study app helpers
        run: python -m pytest app/tests -q
      - name: Checks accept reference solutions and reject mutants
        run: python tools/verify_checks.py --all
