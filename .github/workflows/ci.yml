# Course self-checks. These verify the course material, not the learner.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly full matrix, Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Notebooks, site and course tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest
      - name: Schedule is in sync with tools/build_course.py
        run: |
          python tools/build_course.py
          git diff --exit-code advanced/course.json docs/advanced/schedule.md
      - name: Notebooks are in sync with their sources
        run: python tools/nbbuild.py --check
      - name: Site notebook pages are in sync
        run: python tools/nbpages.py --check
      - name: Diagrams are in sync with their sources
        run: python tools/make_diagrams.py --check
      - name: Notebook structure, syntax, links and images
        run: python tools/check_notebooks.py
      - name: Documentation links
        run: python tools/check_links.py
      - name: Course tests
        run: python -m pytest tests -q

  labs:
    name: Lab checks accept references and reject wrong submissions (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One version per push; all three on the weekly and manual runs.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11", "3.12", "3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: CPU-only PyTorch for notebook 21
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Every reference solution passes and every wrong submission is rejected
        run: python tools/verify_checks.py --all
