# Mahalanobis detector: shrinkage x burn-in length. Deterministic, so one seed is enough to run;
# the table shows n = 1 and sd = NaN for these rows, which is the honest statement.
[sweep]
name = "mahalanobis"
task = "skab_detector"
mode = "grid"
seeds = [0]

[base.data]
raw_dir = "data/raw/skab"
manifest = "labs/w4d4_experiment_tracking/lab/splits/v2.json"

[base.detector]
kind = "mahalanobis"

[grid.detector]
shrinkage = [0.0, 0.1, 0.3]
burn_in = [100, 200]
