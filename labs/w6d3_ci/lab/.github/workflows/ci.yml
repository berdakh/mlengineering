# STARTER: a first-draft workflow that "works" on the author's laptop branch.
# It has at least eight problems. Rewrite it (lesson w6d3, section 4) and add
# .github/workflows/evaluate.yml for the scheduled lane.
name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@v7
        with:
          python-version: 3.10
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python scripts/fetch_skab.py && python scripts/evaluate.py
      - run: docker build -t flowguard .
