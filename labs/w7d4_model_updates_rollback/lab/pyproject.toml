[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.7.0"
description = "Fault detection on the SKAB testbed (course project), w7d4 lab snapshot."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
